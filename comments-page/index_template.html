<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Comments page</title>
<style>
  /* Forced light/white palette (per resolved cv-review annotation — do not
     reintroduce a dark prefers-color-scheme branch). */
  :root { --bg: #f6f8fa; --panel: #ffffff; --border: #d0d7de; --text: #1f2328;
           --muted: #57606a; --accent: #0969da; --warn: #9a6700; --danger: #cf222e; --good: #1a7f37; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.55;
  }
  .layout { display: grid; grid-template-columns: 220px minmax(0,1fr); max-width: 1280px; margin: 0 auto; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } #toc { display: none; } }
  #toc {
    position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
    padding: 24px 14px; border-right: 1px solid var(--border); font-size: 0.82rem;
  }
  #toc a { display: block; color: var(--muted); text-decoration: none; padding: 3px 0; }
  #toc a:hover { color: var(--accent); }
  #toc a.h3 { padding-left: 14px; font-size: 0.78rem; }
  #toc a.h4 { padding-left: 26px; font-size: 0.75rem; }
  .main { max-width: 900px; padding: 32px 24px 120px; overflow-wrap: break-word; }
  #doc-content h1 { font-size: 1.6rem; margin-bottom: 4px; }
  #doc-content h2 { font-size: 1.15rem; margin-top: 40px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  #doc-content h3 { font-size: 1rem; color: var(--accent); margin-top: 24px; }
  #doc-content h4 { font-size: 0.92rem; color: var(--muted); margin-top: 18px; }
  code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 0.88em; }
  pre { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
  pre code { border: none; padding: 0; background: none; }
  .table-scroll { overflow-x: auto; margin: 14px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 560px; }
  th, td { border: 1px solid var(--border); padding: 7px 9px; text-align: left; vertical-align: top; }
  th { background: var(--panel); color: var(--muted); font-weight: 600; }
  hr { border: none; border-top: 1px solid var(--border); margin: 28px 0; }
  .tag { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; margin-left: 8px; vertical-align: middle; }
  .tag.draft { background: rgba(210,153,34,0.15); color: var(--warn); border: 1px solid var(--warn); }
  #sel-popup {
    position: absolute; display: none; z-index: 50; background: var(--accent); color: #fff;
    border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  #ann-composer {
    position: absolute; display: none; z-index: 51; background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; width: 280px; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  #ann-composer blockquote { margin: 0 0 8px; padding: 6px 8px; background: var(--bg); border-left: 3px solid var(--accent);
    font-size: 0.78rem; color: var(--muted); max-height: 60px; overflow-y: auto; }
  #ann-composer textarea { width: 100%; min-height: 60px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px; padding: 6px; font-family: inherit; font-size: 0.85rem; resize: vertical; }
  #ann-composer .row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
  #ann-composer button { border: none; border-radius: 5px; padding: 5px 10px; font-size: 0.8rem; cursor: pointer; }
  #ann-composer .cancel { background: transparent; color: var(--muted); }
  #ann-composer .submit { background: var(--accent); color: #fff; font-weight: 600; }

  #annotations-section { margin-top: 48px; border-top: 2px solid var(--border); padding-top: 20px; }
  .ann-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .ann-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
  .ann-card.resolved { opacity: 0.6; }
  .ann-card .head { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; align-items: center; }
  .ann-card .author-valen { color: var(--good); font-weight: 700; }
  .ann-card .author-claude { color: var(--accent); font-weight: 700; }
  .ann-card blockquote { margin: 0 0 6px; padding: 6px 10px; background: var(--bg); border-left: 3px solid var(--accent);
    font-size: 0.82rem; color: var(--muted); font-style: italic; }
  .ann-card .reply { margin-top: 8px; padding: 8px 10px; background: var(--bg); border-radius: 6px; border-left: 3px solid var(--good); font-size: 0.85rem; }
  .ann-card .reply .who { color: var(--good); font-weight: 700; font-size: 0.75rem; margin-bottom: 3px; }
  .status-badge { font-size: 0.68rem; font-weight: 700; padding: 1px 7px; border-radius: 8px; }
  .status-open { background: rgba(210,153,34,0.15); color: var(--warn); border: 1px solid var(--warn); }
  .status-resolved { background: rgba(63,185,80,0.15); color: var(--good); border: 1px solid var(--good); }
  .locate-btn { font-size: 0.72rem; background: transparent; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 5px; padding: 2px 8px; cursor: pointer; margin-left: 8px; }

  #comment-form { display: flex; flex-direction: column; gap: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  #comment-form select, #comment-form textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-family: inherit; font-size: 0.9rem;
  }
  #comment-form textarea { min-height: 70px; resize: vertical; }
  #comment-form button { align-self: flex-end; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
  #empty-state { color: var(--muted); font-size: 0.85rem; font-style: italic; }
  .status-line { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--border);
    padding: 6px 20px; font-size: 0.72rem; color: var(--muted); text-align: center; }
  .hint { font-size: 0.72rem; color: var(--muted); margin: 4px 0 0; }
</style>
</head>
<body>
<div class="layout">
  <nav id="toc"><a href="/" style="display:block; margin-bottom:10px; font-size:0.78rem;">&larr; All docs</a><div style="color:var(--muted); font-size:0.72rem; text-transform:uppercase; margin-bottom:8px;">On this page</div></nav>
  <div class="main">
    <div id="doc-content">Loading…</div>
    <p class="hint">Select any text above to leave a comment right there — a "+ Comment" button will appear.</p>

    <div id="annotations-section">
      <h2>Comments</h2>
      <div class="ann-list" id="ann-list"></div>
      <form id="comment-form">
        <div style="display:flex; gap:8px; align-items:center;">
          <label style="font-size:0.85rem; color:var(--muted);">Re:</label>
          <select id="question-select"><option value="general">General (not tied to a specific line)</option></select>
        </div>
        <textarea id="comment-text" placeholder="Type a general comment here, or select text above for an inline one..."></textarea>
        <button type="submit">Post comment</button>
      </form>
    </div>
  </div>
</div>

<div id="sel-popup">+ Comment</div>
<div id="ann-composer">
  <blockquote id="ann-composer-quote"></blockquote>
  <textarea id="ann-composer-text" placeholder="Your note..."></textarea>
  <div class="row">
    <button class="cancel" type="button" id="ann-composer-cancel">Cancel</button>
    <button class="submit" type="button" id="ann-composer-submit">Comment</button>
  </div>
</div>

<div class="status-line" id="status-line">connecting…</div>

<script>
// ---- tiny self-contained markdown -> HTML renderer ----
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/~~(.+?)~~/g, '<s>$1</s>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function renderMarkdown(md) {
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  let html = '', i = 0, inCode = false, codeBuf = [], tableRows = [], listBuf = [], listOrdered = false;
  function flushList() {
    if (listBuf.length) {
      const tag = listOrdered ? 'ol' : 'ul';
      html += `<${tag}>` + listBuf.map(li => `<li>${inline(li)}</li>`).join('') + `</${tag}>`;
      listBuf = [];
    }
  }
  function flushTable() {
    if (tableRows.length >= 2) {
      const header = tableRows[0], body = tableRows.slice(2);
      const headCells = header.split('|').slice(1, -1).map(c => c.trim());
      html += '<div class="table-scroll"><table><thead><tr>' + headCells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
      body.forEach(r => {
        const cells = r.split('|').slice(1, -1).map(c => c.trim());
        html += '<tr>' + cells.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>';
      });
      html += '</tbody></table></div>';
    }
    tableRows = [];
  }
  while (i < lines.length) {
    const line = lines[i];
    if (line.trim().startsWith('```')) {
      if (!inCode) { flushList(); flushTable(); inCode = true; codeBuf = []; }
      else { html += `<pre><code>${escapeHtml(codeBuf.join('\n'))}</code></pre>`; inCode = false; }
      i++; continue;
    }
    if (inCode) { codeBuf.push(line); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) { flushList(); tableRows.push(line.trim()); i++; continue; }
    else if (tableRows.length) { flushTable(); }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { flushList(); const level = h[1].length; html += `<h${level}>${inline(h[2])}</h${level}>`; i++; continue; }
    if (/^-{3,}\s*$/.test(line.trim())) { flushList(); html += '<hr>'; i++; continue; }
    const li = line.match(/^\s*[-*]\s+(.*)$/);
    const oli = line.match(/^\s*\d+\.\s+(.*)$/);
    if (li) { if (listBuf.length && listOrdered) flushList(); listOrdered = false; listBuf.push(li[1]); i++; continue; }
    if (oli) { if (listBuf.length && !listOrdered) flushList(); listOrdered = true; listBuf.push(oli[1]); i++; continue; }
    if (listBuf.length) flushList();
    if (line.trim() === '') { i++; continue; }
    html += `<p>${inline(line)}</p>`;
    i++;
  }
  flushList(); flushTable();
  return html;
}

function slugify(s, seen) {
  let base = s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'section';
  let slug = base, n = 2;
  while (seen.has(slug)) { slug = `${base}-${n++}`; }
  seen.add(slug);
  return slug;
}

function buildToc(container) {
  const toc = document.getElementById('toc');
  const seen = new Set();
  const headings = container.querySelectorAll('h1, h2, h3, h4');
  headings.forEach(h => {
    const id = slugify(h.textContent, seen);
    h.id = id;
    const a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = h.textContent;
    a.className = h.tagName.toLowerCase();
    if (h.tagName === 'H1') a.style.fontWeight = '700';
    toc.appendChild(a);
  });
}

function getOffset(container, node, offset) {
  const range = document.createRange();
  range.selectNodeContents(container);
  try { range.setEnd(node, offset); } catch (e) { return null; }
  return range.toString().length;
}

let openQuestionCount = 0;
let currentSelection = null;
const DOC_SLUG = (location.pathname.match(/^\/d\/([a-z0-9-]+)/) || [])[1] || '';
const api = (kind) => `/api/${DOC_SLUG}/${kind}`;

function setupSelectionHandling() {
  const container = document.getElementById('doc-content');
  const popup = document.getElementById('sel-popup');
  const composer = document.getElementById('ann-composer');

  document.addEventListener('mouseup', (e) => {
    if (composer.contains(e.target) || popup.contains(e.target)) return;
    const sel = window.getSelection();
    const text = sel.toString().trim();
    if (!text || sel.rangeCount === 0 || !container.contains(sel.anchorNode)) {
      popup.style.display = 'none';
      return;
    }
    const range = sel.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    const start = getOffset(container, range.startContainer, range.startOffset);
    const end = getOffset(container, range.endContainer, range.endOffset);
    currentSelection = { quote: text.slice(0, 500), start, end };
    popup.style.left = (window.scrollX + rect.left) + 'px';
    popup.style.top = (window.scrollY + rect.top - 34) + 'px';
    popup.style.display = 'block';
  });

  popup.addEventListener('mousedown', (e) => {
    e.preventDefault();
    if (!currentSelection) return;
    document.getElementById('ann-composer-quote').textContent = currentSelection.quote;
    composer.style.left = popup.style.left;
    composer.style.top = (parseInt(popup.style.top) + 30) + 'px';
    composer.style.display = 'block';
    popup.style.display = 'none';
    document.getElementById('ann-composer-text').focus();
  });

  document.getElementById('ann-composer-cancel').addEventListener('click', () => {
    composer.style.display = 'none';
    document.getElementById('ann-composer-text').value = '';
  });

  document.getElementById('ann-composer-submit').addEventListener('click', async () => {
    const text = document.getElementById('ann-composer-text').value.trim();
    if (!text || !currentSelection) return;
    await fetch(api('annotations'), {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ type: 'inline', quote: currentSelection.quote, start: currentSelection.start, end: currentSelection.end, text, author: 'valen' })
    });
    composer.style.display = 'none';
    document.getElementById('ann-composer-text').value = '';
    loadAnnotations();
  });
}

function locateInDoc(quote) {
  window.getSelection().removeAllRanges();
  if (window.find) {
    const found = window.find(quote);
    if (!found) alert('Could not locate that text in the current page (the doc may have changed since this comment was made).');
  }
}

async function loadDoc() {
  try {
    const res = await fetch(api('doc'));
    const md = await res.text();
    const container = document.getElementById('doc-content');
    container.innerHTML = renderMarkdown(md);
    const h1 = container.querySelector('h1');
    if (h1 && !h1.querySelector('.tag')) h1.insertAdjacentHTML('beforeend', ' <span class="tag draft">DRAFT — OPEN FOR COMMENT</span>');
    document.getElementById('toc').innerHTML = '<a href="/" style="display:block; margin-bottom:10px; font-size:0.78rem;">&larr; All docs</a><div style="color:var(--muted); font-size:0.72rem; text-transform:uppercase; margin-bottom:8px;">On this page</div>';
    buildToc(container);

    const ols = container.querySelectorAll('ol');
    const oq = ols.length ? ols[ols.length - 1] : null;
    const select = document.getElementById('question-select');
    select.innerHTML = '<option value="general">General (not tied to a specific line)</option>';
    if (oq) {
      oq.querySelectorAll(':scope > li').forEach((li, idx) => {
        const n = idx + 1;
        const label = li.textContent.trim().slice(0, 60);
        const opt = document.createElement('option');
        opt.value = 'q' + n;
        opt.textContent = `#${n}: ${label}…`;
        select.appendChild(opt);
      });
    }
  } catch (e) {
    document.getElementById('doc-content').innerHTML = '<p style="color:var(--danger)">Failed to load doc — ' + e + '</p>';
  }
}

async function loadAnnotations() {
  try {
    const res = await fetch(api('annotations'));
    const items = await res.json();
    const list = document.getElementById('ann-list');
    if (items.length === 0) {
      list.innerHTML = '<div id="empty-state">No comments yet — select text above, or use the general box below.</div>';
    } else {
      list.innerHTML = items.slice().reverse().map(c => `
        <div class="ann-card ${c.status === 'resolved' ? 'resolved' : ''}">
          <div class="head">
            <span><span class="author-${c.author}">${c.author === 'claude' ? 'Claude Code' : 'Valen'}</span> · ${c.ts}</span>
            <span class="status-badge status-${c.status}">${c.status}</span>
          </div>
          ${c.quote ? `<blockquote>"${c.quote.replace(/</g,'&lt;')}" <button class="locate-btn" onclick='locateInDoc(${JSON.stringify(c.quote)})'>Locate →</button></blockquote>` : ''}
          <div>${c.text.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>
          ${c.reply ? `<div class="reply"><div class="who">Claude Code replied</div>${c.reply.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>` : ''}
        </div>
      `).join('');
    }
    document.getElementById('status-line').textContent = `live · ${items.length} comment(s) · polling every 4s`;
  } catch (e) {
    document.getElementById('status-line').textContent = 'connection lost, retrying…';
  }
}

document.getElementById('comment-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = document.getElementById('comment-text').value.trim();
  if (!text) return;
  const question = document.getElementById('question-select').value;
  await fetch(api('annotations'), {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ type: 'general', text: question !== 'general' ? `[${question}] ${text}` : text, author: 'valen' })
  });
  document.getElementById('comment-text').value = '';
  loadAnnotations();
});

fetch(api('title')).then(r => r.json()).then(d => { if (d.title) document.title = d.title; }).catch(() => {});
setupSelectionHandling();
loadDoc();
loadAnnotations();
setInterval(loadAnnotations, 4000);
setInterval(loadDoc, 15000);
</script>
</body>
</html>
