<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Review hub</title>
<style>
  /* Forced light/white palette, matching index_template.html */
  :root { --bg:#f6f8fa; --panel:#ffffff; --border:#d0d7de; --text:#1f2328; --muted:#57606a; --accent:#0969da; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 1.4rem; margin-bottom: 6px; }
  p.sub { color: var(--muted); font-size: 0.88rem; margin-top: 0; }
  .doc-group { margin-top: 28px; }
  .doc-group h2 { font-size: 0.78rem; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .doc-list { display: flex; flex-direction: column; gap: 10px; }
  .doc-card { display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; text-decoration: none; color: var(--text); font-weight: 600; }
  .doc-card:hover { border-color: var(--accent); }
  #empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Review hub</h1>
  <p class="sub">All reviewable docs on this instance — select text on any page to leave an anchored comment.</p>
  <div id="doc-list">Loading…</div>
</div>
<script>
function cardHTML(docs) {
  return `<div class="doc-list">` + docs.map(d => `<a class="doc-card" href="/d/${d.slug}">${d.title}</a>`).join('') + `</div>`;
}

fetch('/api/docs').then(r => r.json()).then(docs => {
  const container = document.getElementById('doc-list');
  if (!docs.length) { container.innerHTML = '<div id="empty">No docs yet.</div>'; return; }

  const grouped = {};
  const ungrouped = [];
  docs.forEach(d => {
    if (d.group) {
      (grouped[d.group] = grouped[d.group] || []).push(d);
    } else {
      ungrouped.push(d);
    }
  });

  let html = '';
  Object.keys(grouped).sort().forEach(group => {
    const siblings = grouped[group].sort((a, b) => (a.order || 0) - (b.order || 0));
    const label = group.charAt(0).toUpperCase() + group.slice(1);
    html += `<div class="doc-group"><h2>${label}</h2>${cardHTML(siblings)}</div>`;
  });
  if (ungrouped.length) {
    html += `<div class="doc-group">${grouped && Object.keys(grouped).length ? '<h2>Other</h2>' : ''}${cardHTML(ungrouped)}</div>`;
  }
  container.innerHTML = html;
}).catch(() => {
  document.getElementById('doc-list').innerHTML = '<div id="empty">Failed to load doc list.</div>';
});
</script>
</body>
</html>
